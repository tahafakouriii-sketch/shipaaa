name: SHIPAA Android v1.1.0 - Build APK

on:
  push:
    branches: [main]
    paths:
      - shipaa-android-v1.1.0.zip
      - .github/workflows/blank.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipaaa-android-v110-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build, test and package Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract the uploaded v1.1.0 project
        shell: bash
        run: |
          set -euo pipefail
          test -f shipaa-android-v1.1.0.zip
          unzip -tq shipaa-android-v1.1.0.zip
          mkdir -p extracted
          unzip -q shipaa-android-v1.1.0.zip -d extracted
          test -f extracted/shipaa-android/settings.gradle.kts
          test -f extracted/shipaa-android/app/build.gradle.kts
          test -f extracted/shipaa-android/gradle/wrapper/gradle-wrapper.jar

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK and run unit tests
        working-directory: extracted/shipaa-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=extracted/shipaa-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          unzip -tq "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIPAA-Android-v1.1.0-APK
          path: extracted/shipaa-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check WordPress bridge PHP tests
        working-directory: extracted/shipaa-android
        run: |
          php -l wordpress/shipaa-app-sync/shipaa-app-sync.php
          php -l wordpress/shipaa-app-sync/uninstall.php
          php wordpress/shipaa-app-sync/tests/run-tests.php

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser bridge tests
        working-directory: extracted/shipaa-android/tools/bridge-test
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHIPAA-v1.1.0-build-reports
          path: |
            extracted/shipaa-android/app/build/reports/
            extracted/shipaa-android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
